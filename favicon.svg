<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#5856D6" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#007AFF" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    .bg { fill: #1D1D1F; transition: fill 0.3s; }
    .mark { fill: url(#appleGradient); }
    .letter { fill: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1C1C1E; }
    }
  </style>
  
  <!-- Apple-style Squircle Container -->
  <rect class="bg" x="2" y="2" width="60" height="60" rx="16" />
  
  <!-- Modern Geometric "JS" Monogram -->
  <g filter="url(#subtleGlow)">
    <!-- Stylized J -->
    <path d="M 23 18 L 29 18 L 29 37 C 29 42 25 45 20 45 C 16.5 45 14 43 13 40.5 L 17.5 38 C 18 39.2 19 40.2 20.2 40.2 C 22.2 40.2 23.5 39 23.5 36.5 L 23.5 18 Z" fill="url(#appleGradient)" />
    <!-- Stylized S Interlocking -->
    <path d="M 44.5 24 C 43.5 20.5 40 18 35.5 18 C 30.5 18 27 21 27 25 C 27 28.5 29.5 30.5 34 31.8 L 36.5 32.5 C 39.5 33.4 41 34.6 41 36.5 C 41 39 38.5 40.5 35 40.5 C 31.5 40.5 29 38.5 28.2 35.5 L 23.5 37.5 C 24.8 42 29 45 35 45 C 42 45 46.5 41.5 46.5 36 C 46.5 32 43.5 29.8 39 28.5 L 36.5 27.8 C 33.5 26.8 32.2 25.8 32.2 24.2 C 32.2 22.2 34 21 36 21 C 38.5 21 40.2 22.2 41 24.2 L 44.5 24 Z" fill="#FFFFFF" />
  </g>
</svg>